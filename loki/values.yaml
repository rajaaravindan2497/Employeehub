loki:
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

  rulerConfig:
    enable_api: true

deploymentMode: Monolithic

singleBinary:
  replicas: 1

# Persistent storage for Loki
  persistence:
    enabled: true
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  service:
    type: LoadBalancer

# Temporary MinIO storage for development/testing
ignoreMinioDeprecation: true

minio:
  enabled: true
  persistence:
    storageClass: gp3

chunksCache:
  allocatedMemory: 512
  resources:
    requests:
      cpu: 50m
      memory: 600Mi
    limits:
      memory: 600Mi

# Disable other deployment modes
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0