apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employeehub-hpa
  namespace: employeehub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employeehub-deployment

  minReplicas: 2
  maxReplicas: 4

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70