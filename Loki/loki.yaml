apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: "18.7.6"
      helm:
        valueFiles:
          - $values/Loki/values.yaml

    - repoURL: https://github.com/rajaaravindan2497/Employeehub.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: loki

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway-external
  namespace: loki
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: loki
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP