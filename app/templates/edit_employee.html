<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Employee - Employeehub</title>

<style>

    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
    }

    .container {
        max-width: 700px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
        color: #1f2937;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 6px;
        cursor: pointer;
    }

    .back {
        display: inline-block;
        margin-left: 10px;
        color: #2563eb;
        text-decoration: none;
    }

</style>

</head>

<body>

<div class="container">

<h1>Edit Employee</h1>

<form
    method="POST"
    action="/employees/edit/{{ employee[0] }}">

    <div class="form-group">

        <label for="employee_id">
            Employee ID
        </label>

        <input
            type="text"
            id="employee_id"
            name="employee_id"
            value="{{ employee[1] }}"
            required>

    </div>


    <div class="form-group">

        <label for="name">
            Employee Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ employee[2] }}"
            required>

    </div>


    <div class="form-group">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ employee[3] }}"
            required>

    </div>


    <div class="form-group">

        <label for="department">
            Department
        </label>

        <input
            type="text"
            id="department"
            name="department"
            value="{{ employee[4] or '' }}">

    </div>


    <div class="form-group">

        <label for="designation">
            Designation
        </label>

        <input
            type="text"
            id="designation"
            name="designation"
            value="{{ employee[5] or '' }}">

    </div>


    <button type="submit">
        Update Employee
    </button>


    <a
        href="/"
        class="back">

        Cancel

    </a>

</form>

</div>

</body>

</html>
